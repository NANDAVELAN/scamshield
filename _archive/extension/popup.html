<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScamShield Protection</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2e;
      --border: #23304a;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.3px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .badge-online {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .badge-offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 70px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      padding: 8px;
      font-size: 12px;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    textarea:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }
    .result-box {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .recent-item {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .recent-item:last-child { border-bottom: none; }
    .risk-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .risk-high { background: #dc2626; color: white; }
    .risk-med { background: #d97706; color: white; }
    .risk-low { background: #16a34a; color: white; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️ ScamShield</div>
    <span class="badge badge-online" id="status-badge">ONLINE</span>
  </div>

  <div class="card">
    <div class="title">Quick Text & Link Scan</div>
    <textarea id="quick-input" placeholder="Paste suspicious SMS, WhatsApp, or URL here..."></textarea>
    <button class="btn" id="btn-scan">⚡ Reflex Scan</button>
    <div class="result-box" id="scan-result"></div>
  </div>

  <div class="card">
    <div class="title">Recent Defense History</div>
    <div id="recent-list">
      <div style="color: var(--muted); font-size: 11px;">Loading activity...</div>
    </div>
  </div>

  <button class="btn btn-secondary" id="btn-control-center">
    🖥️ Open Control Center
  </button>

  <script src="popup.js"></script>
</body>
</html>
