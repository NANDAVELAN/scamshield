<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScamShield</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#0b1220;--panel:#121b2e;--line:#22304b;--tx:#e8eefb;--mut:#8a98b5;--safe:#3ecf9a;--warn:#f2b441;--bad:#ff5d6c;--acc:#5ec8ff;--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6fc;--panel:#fff;--line:#d8e0ef;--tx:#0e1a33;--mut:#5b6987;--safe:#0f9d6e;--warn:#b97a00;--bad:#d4293d;--acc:#0a78b8}}
:root[data-theme="dark"]{--bg:#0b1220;--panel:#121b2e;--line:#22304b;--tx:#e8eefb;--mut:#8a98b5}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 'Schibsted Grotesk',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.mode{font:12px 'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--acc)}
main{flex:1;overflow-y:auto;padding:0 14px 16px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.shield{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--safe) 18%,transparent);border:2px solid var(--safe);flex:none}
.hero.off .shield{border-color:var(--mut);background:transparent;filter:grayscale(1)}
.hero b{display:block;font-size:17px}.hero span{color:var(--mut);font-size:13px}
.sw{margin-left:auto;width:46px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--safe)}.sw.on::after{transform:translateX(18px)}
.onboard{background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:12px;cursor:pointer;animation:in .35s}
.onboard b{color:var(--warn);display:block;font-size:14px}.onboard span{color:var(--tx);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{font-size:20px;display:block}.stats span{font-size:12px;color:var(--mut)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px;color:var(--mut);font-size:13px}
.btn{background:var(--acc);color:#04121f;border:0;border-radius:10px;padding:8px 12px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;cursor:pointer;animation:in .35s}
@keyframes in{from{transform:translateY(-8px);opacity:0}}
.card.safe{--c:var(--safe)}.card.warn{--c:var(--warn)}.card.bad{--c:var(--bad)}
.row{display:flex;align-items:center;gap:8px}
.ch{font-size:18px}.from{font-weight:700;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font:12px 'JetBrains Mono',monospace;color:var(--c);border:1px solid var(--c);border-radius:8px;padding:1px 7px}
.txt{margin-top:6px;color:var(--mut);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sealed .txt{filter:blur(5px);user-select:none}
.seal{margin-top:6px;font-size:12px;color:var(--bad)}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:4px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 8px;font:13px inherit;font-family:inherit;cursor:pointer}
.tabs button span{display:block;font-size:20px}.tabs button.on{color:var(--acc)}
.toast{position:absolute;left:12px;right:12px;top:10px;background:var(--panel);border:1px solid var(--bad);border-radius:14px;padding:10px 14px;z-index:9;transform:translateY(-130%);transition:transform .35s;box-shadow:0 8px 24px #0006}
.toast.show{transform:none}.toast b{color:var(--bad)}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:8;transform:translateY(100%);transition:transform .3s;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet .bd{flex:1;overflow-y:auto;padding:0 16px 16px}
.back{background:none;border:0;color:var(--acc);font:15px inherit;font-family:inherit;padding:14px 16px;text-align:left;cursor:pointer}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:14px;font-size:14px}
.msg.sealed p{filter:blur(6px);user-select:none}
.pipe{display:flex;justify-content:space-between;margin:6px 0 12px}
.nd{text-align:center;font-size:11px;color:var(--mut);width:20%}
.nd i{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 4px;border-radius:50%;border:1.5px solid var(--line);font-style:normal;font-size:18px;transition:.3s}
.nd.run i{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.nd.done i{border-color:var(--safe);background:color-mix(in srgb,var(--safe) 15%,transparent)}
.log{background:#050a14;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.7 'JetBrains Mono',monospace;color:#7fd1ff;min-height:130px;overflow-x:auto;white-space:pre-wrap}
.log .l{color:var(--mut)}
.verdict{border-radius:var(--r);padding:14px;margin-top:14px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.verdict.safe{--c:var(--safe)}.verdict.warn{--c:var(--warn)}.verdict.bad{--c:var(--bad)}
.verdict h2{font-size:18px;color:var(--c)}.verdict p{font-size:14px;margin:6px 0 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.set{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;margin-bottom:14px}
.set .row{padding:12px 0;border-bottom:1px solid var(--line);justify-content:space-between}.set .row:last-child{border:0}
.set small{display:block;color:var(--mut);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mut);padding:6px 10px;font:12px 'JetBrains Mono',monospace;cursor:pointer}
.seg button.on{background:var(--acc);color:#04121f}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--tx);font:12px 'JetBrains Mono',monospace;margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div class="toast" id="toast"></div>
  <header><h1>ScamShield</h1><span class="mode" id="modeTag">rules</span></header>
  <main id="main"></main>
  <nav class="tabs">
    <button data-t="feed" class="on"><span>🛡️</span>Shield</button>
    <button data-t="agent"><span>🧠</span>Agent</button>
    <button data-t="set"><span>⚙️</span>Settings</button>
  </nav>
  <div class="sheet" id="sheet"><button class="back" id="back">‹ Back to feed</button><div class="bd" id="sheetBody"></div></div>
</div>
<script>
const CH={wa:'💬',sms:'✉️',mail:'📧',web:'🌐'};
const SAMPLES=[
{ch:'wa',from:'+91 98xxx 41207',body:'Congratulations! You won ₹25,00,000 in the KBC lottery. Claim now: kbc-claim.in/win',r:0.71,u:'kbc-claim.in registered 3 days ago, lookalike of a TV brand',s:'Unknown number, no business profile',a:null,v:'bad',sc:92,act:'block',why:'Lottery bait with a brand-new domain and an unknown sender.'},
{ch:'sms',from:'VM-HDFCBK',body:'Your a/c XX4521 is debited Rs 1,250 at Swiggy. Not you? Call the number on your card.',r:0.06,u:null,s:'Registered bank sender ID',a:null,v:'safe',sc:8,act:'allow',why:'Registered sender, no links, normal transaction alert.'},
{ch:'mail',from:'HDFC Bank <support@hdfc-secure.co>',body:'Your KYC expires today. Update immediately at hdfc-kyc-verify.top or your account will be frozen.',r:0.78,u:'Homoglyph and lookalike domain, 2 days old',s:'Display name says HDFC, domain does not. SPF fail',a:null,v:'bad',sc:88,act:'block',why:'Bank impersonation with urgency, failed SPF and a lookalike link.'},
{ch:'sms',from:'+91 70xxx 99310',body:'Dear user, your electricity will be disconnected tonight 9:30pm. Call 70xxx 99310 immediately.',r:0.64,u:null,s:'Personal mobile number posing as a utility',a:null,v:'bad',sc:81,act:'block',why:'Classic power-cut scam: fake urgency and a personal number to call.'},
{ch:'mail',from:'Zoho Payroll <noreply@zoho.com>',body:'Your payslip for September is attached (payslip.pdf).',r:0.1,u:null,s:'SPF, DKIM, DMARC pass',a:'payslip.pdf is a plain PDF, no scripts',v:'safe',sc:12,act:'allow',why:'Authenticated sender and a clean attachment.'},
{ch:'wa',from:'Unknown',body:'Hi! Part-time job, earn ₹3000/day just by liking YouTube videos. Reply YES to start.',r:0.45,u:null,s:'Unknown number, first contact',a:null,v:'warn',sc:58,act:'warn',why:'Matches the task-job scam pattern, but no link or payment request yet.'},
{ch:'mail',from:'Amazon <orders@amaz0n-deals.com>',body:'Your refund invoice is attached. Open to receive payment. (Invoice.pdf.exe)',r:0.83,u:'amaz0n-deals.com uses a zero for "o"',s:'Display name spoof, domain mismatch',a:'Double extension .pdf.exe is an executable',v:'bad',sc:94,act:'block',why:'Spoofed brand and a disguised executable attachment.'}
];

const savedApi = localStorage.getItem('scamshield_api') || 'http://10.0.2.2:8000';
const savedDemo = localStorage.getItem('scamshield_demo') !== 'false';

const state={
  on: true,
  tab: 'feed',
  mode: 'rules',
  items: [],
  n: 0,
  scanned: 0,
  blocked: 0,
  warned: 0,
  chs: {wa:true, sms:true, mail:true},
  local: true,
  demo: savedDemo,
  api: savedApi,
  hasAccess: true
};

const $=s=>document.querySelector(s);
const time=()=>new Date().toLocaleTimeString('en-GB');

function saveSettings(){
  localStorage.setItem('scamshield_api', state.api);
  localStorage.setItem('scamshield_demo', state.demo);
}

// Native NotificationBridge integration
const bridge = window.Capacitor?.Plugins?.NotificationBridge;
if(bridge){
  bridge.isAccessGranted().then(r => {
    state.hasAccess = !!r.granted;
    render();
  }).catch(() => {});

  bridge.addListener('messageReceived', async (rawMsg) => {
    if(!state.on) return;
    const chMap = {whatsapp:'wa', sms:'sms', gmail:'mail'};
    const ch = chMap[rawMsg.channel] || 'sms';
    if(!state.chs[ch]) return;

    const it = {
      id: ++state.n,
      ch: ch,
      from: rawMsg.sender || 'Unknown',
      body: rawMsg.body || '',
      r: 0.5,
      u: null,
      s: 'Live notification captured',
      a: null,
      v: 'warn',
      sc: 50,
      act: 'warn',
      why: 'Analyzing notification...'
    };

    try {
      const vData = await analyzeBackend(it);
      it.v = vData.verdict === 'safe' ? 'safe' : (vData.verdict === 'suspicious' ? 'warn' : 'bad');
      it.sc = vData.score;
      it.act = vData.action;
      it.why = vData.reason;
      it.evidence = vData.evidence;

      if(it.v === 'bad'){
        bridge.postBlockNotification({ sender: it.from }).catch(()=>{});
      }
    } catch(e) {
      console.warn('Backend error:', e);
    }

    state.items.unshift(it);
    state.scanned++;
    if(it.v === 'bad') state.blocked++;
    if(it.v === 'warn') state.warned++;
    if(state.tab === 'feed') render();
  });
}

function scoreOnDevice(sample){
  const text = ((sample.body || '') + ' ' + (sample.from || '')).toLowerCase();
  let score = 5;
  let label = 'safe';
  let why = 'Normal personal or transactional communication';
  let scamType = 'none';

  if(/kyc|pan card|bank account.*suspend|debit card.*block|sbi|hdfc|icici/i.test(text) && /http|bit\.ly|link|update|click/i.test(text)){
    score = 90; label = 'bad'; scamType = 'fake_kyc';
    why = 'Bank impersonation with urgent KYC suspension threat and unverified link.';
  } else if(/electric|power cut|bill.*due|disconnected tonight/i.test(text)){
    score = 85; label = 'bad'; scamType = 'bill_disconnect';
    why = 'Utility bill disconnection threat directing to an unverified number.';
  } else if(/narcotic|contraband|customs|cbi|police|arrest|dhl|fedex/i.test(text) && /parcel|held|drug|illegal/i.test(text)){
    score = 92; label = 'bad'; scamType = 'digital_arrest';
    why = 'Law enforcement or illegal parcel extortion pattern (digital arrest).';
  } else if(/lottery|won.*lakh|kbc|cashback.*claim|winner/i.test(text)){
    score = 88; label = 'bad'; scamType = 'lottery';
    why = 'Unsolicited lottery or prize bait designed to extract advance fees.';
  } else if(/part-time|like youtube|earn ₹|earn rs|work from home/i.test(text)){
    score = 65; label = 'warn'; scamType = 'job_offer';
    why = 'Unsolicited task-job recruitment pattern with unrealistic daily payouts.';
  } else if(/\.exe|\.apk|\.scr|\.zip/i.test(text)){
    score = 95; label = 'bad'; scamType = 'malware';
    why = 'Dangerous executable attachment disguised as a document.';
  }

  return {
    score: score,
    verdict: label === 'bad' ? 'scam' : (label === 'warn' ? 'suspicious' : 'safe'),
    action: label === 'bad' ? 'block' : (label === 'warn' ? 'warn' : 'allow'),
    reason: why + ' (Scored by On-Device Rules)',
    evidence: {
      reflex: 'On-Device Reflex Gate completed in 2ms',
      url: 'Evaluated locally',
      sender: sample.from,
      attachment: 'Scanned locally'
    }
  };
}

async function analyzeBackend(sample){
  const payload = {
    id: sample.id || 'msg_' + Date.now(),
    channel: sample.ch === 'wa' ? 'whatsapp' : (sample.ch === 'mail' ? 'gmail' : sample.ch),
    sender: sample.from,
    body: sample.body,
    urls: [],
    attachments: sample.body.includes('.pdf.exe') ? [{name:'Invoice.pdf.exe', mime:'application/x-msdownload'}] : (sample.body.includes('.pdf') ? [{name:'payslip.pdf', mime:'application/pdf'}] : []),
    headers: sample.body.includes('KYC') ? {spf:'fail'} : (sample.body.includes('payslip') ? {spf:'pass', dkim:'pass'} : {}),
    timestamp: Date.now()
  };

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3500);

  try {
    const res = await fetch(`${state.api.replace(/\/+$/, '')}/analyze`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(err) {
    clearTimeout(timeoutId);
    console.warn('Backend unavailable or timed out. Falling back to On-Device Rules engine:', err);
    return scoreOnDevice(sample);
  }
}

async function addItem(i){
  const s = SAMPLES[i % SAMPLES.length];
  if(!state.chs[s.ch]) return;
  const it = {...s, id: ++state.n};

  if(!state.demo){
    const vData = await analyzeBackend(it);
    it.v = vData.verdict === 'safe' ? 'safe' : (vData.verdict === 'suspicious' ? 'warn' : 'bad');
    it.sc = vData.score || vData.risk_score || 50;
    it.act = vData.action || vData.recommended_action || 'warn';
    it.why = vData.reason || vData.explanation_en || 'Analyzed';
    it.evidence = vData.evidence;
  }

  state.items.unshift(it);
  state.scanned++;
  if(it.v === 'bad') state.blocked++;
  if(it.v === 'warn') state.warned++;

  if(it.v === 'bad' && state.on){
    const t = $('#toast');
    t.innerHTML = '<b>Blocked</b> a scam from ' + esc(it.from) + '. Message kept sealed.';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);

    if(bridge){
      bridge.postBlockNotification({ sender: it.from }).catch(()=>{});
    }
  }

  if(state.tab === 'feed') render();
}

function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cardHTML(it){const sealed=it.v==='bad'&&state.on;
 return `<div class="card ${it.v} ${sealed?'sealed':''}" data-id="${it.id}"><div class="row"><span class="ch">${CH[it.ch]||'📱'}</span><span class="from">${esc(it.from)}</span><span class="chip">${it.v==='safe'?'Safe':it.v==='warn'?'Suspicious':'Scam'} ${it.sc}</span></div><div class="txt">${esc(it.body)}</div>${sealed?'<div class="seal">🔒 Sealed. Tap to see why, not to read.</div>':''}</div>`}

function render(){
 const m=$('#main');
 if(state.tab==='feed'){
  const onboardHTML = (!state.hasAccess && bridge) ? `<div class="onboard" id="onboardCard"><b>⚠️ Notification Access Needed</b><span>Tap to grant permission so ScamShield can protect WhatsApp, SMS and Gmail notifications.</span></div>` : '';
  m.innerHTML=`${onboardHTML}<div class="hero ${state.on?'':'off'}"><div class="shield">🛡️</div><div><b>${state.on?'Protection is on':'Protection is off'}</b><span>${state.on?'Watching WhatsApp, SMS and Gmail':'Messages are not being checked'}</span></div><button class="sw ${state.on?'on':''}" id="sw" aria-label="Toggle protection"></button></div>
 <div class="stats"><div><b>${state.scanned}</b><span>Scanned</span></div><div><b style="color:var(--bad)">${state.blocked}</b><span>Blocked</span></div><div><b style="color:var(--warn)">${state.warned}</b><span>Warned</span></div></div>
 <div class="sec"><span>Recent messages</span><button class="btn" id="sim">Simulate incoming</button></div>${state.items.length?state.items.map(cardHTML).join(''):'<div class="empty">No messages yet. Tap Simulate incoming to test.</div>'}`;
 
 if($('#onboardCard')){
   $('#onboardCard').onclick = () => { if(bridge) bridge.openAccessSettings(); };
 }
 $('#sw').onclick=()=>{state.on=!state.on;render()};$('#sim').onclick=()=>addItem(Math.floor(Math.random()*SAMPLES.length));
 m.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(+c.dataset.id))}
 else if(state.tab==='agent'){
  m.innerHTML=`<div class="sec"><span>How a message is checked</span></div>
 <div class="set"><div class="row"><div><b>1 Reflex gate</b><small>TypeSafe Jev gives a quick score in milliseconds (<30ms).</small></div></div><div class="row"><div><b>2 Triage agent</b><small>Picks which checks the message needs.</small></div></div><div class="row"><div><b>3 URL, sender, attachment</b><small>Investigators inspect lookalikes, spoofed senders and risky files.</small></div></div><div class="row"><div><b>4 Verdict (Gemini Pro → Ollama → Rules)</b><small>One score, one action, one reason in plain words.</small></div></div></div>
 <div class="sec"><span>Engine</span></div><div class="set"><div class="row"><div><b>Reasoning mode</b><small>Rules work offline on-device. LLM uses Gemini Pro / PC Ollama fallback.</small></div><div class="seg" id="seg">${['rules','llm','auto'].map(x=>`<button data-m="${x}" class="${state.mode===x?'on':''}">${x}</button>`).join('')}</div></div></div>`;
 $('#seg').onclick=e=>{if(e.target.dataset.m){state.mode=e.target.dataset.m;$('#modeTag').textContent=state.mode;render()}}}
 else{
  m.innerHTML=`<div class="sec"><span>Apps to watch</span></div><div class="set">${[['wa','WhatsApp','Reads notification text only'],['sms','SMS','Reads incoming texts'],['mail','Gmail','Reads notification and sender']].map(([k,n,d])=>`<div class="row"><div><b>${CH[k]} ${n}</b><small>${d}</small></div><button class="sw ${state.chs[k]?'on':''}" data-k="${k}" aria-label="Toggle ${n}"></button></div>`).join('')}</div>
 <div class="sec"><span>Demo & Network Connection</span></div><div class="set">
  <div class="row"><div><b>Demo mode</b><small>Use offline SAMPLES for presentation</small></div><button class="sw ${state.demo?'on':''}" id="demoSw" aria-label="Toggle Demo mode"></button></div>
  <div class="row"><div><b>Check on this phone first</b><small>Fast on-device heuristic gate runs locally with 0ms latency.</small></div><button class="sw ${state.local?'on':''}" id="loc" aria-label="Toggle on-device first"></button></div>
  <div class="row" style="display:block">
    <b>Backend / Ollama Host URL</b>
    <input type="text" id="api" value="${esc(state.api)}">
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
      <button class="btn ghost" style="padding:4px 8px;font-size:11px" id="setWifiIp">PC Wi-Fi (192.168.137.221)</button>
      <button class="btn ghost" style="padding:4px 8px;font-size:11px" id="setUsbIp">USB Cable (localhost)</button>
      <button class="btn ghost" style="padding:4px 8px;font-size:11px" id="setEmuIp">Emulator (10.0.2.2)</button>
    </div>
    <div style="margin-top:10px;display:flex;align-items:center;justify-content:space-between">
      <button class="btn" style="padding:6px 12px;font-size:12px" id="testConnBtn">⚡ Test Connection</button>
      <span id="connStatus" style="font-size:12px;color:var(--mut)">Untested</span>
    </div>
  </div>
 </div>`;
 m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{state.chs[b.dataset.k]=!state.chs[b.dataset.k];render()});
 $('#demoSw').onclick=()=>{state.demo=!state.demo;saveSettings();render()};
 $('#loc').onclick=()=>{state.local=!state.local;saveSettings();render()};
 $('#api').oninput=e=>{state.api=e.target.value;saveSettings()};
 $('#setWifiIp').onclick=()=>{state.api='http://192.168.137.221:8000';$('#api').value=state.api;saveSettings()};
 $('#setUsbIp').onclick=()=>{state.api='http://localhost:8000';$('#api').value=state.api;saveSettings()};
 $('#setEmuIp').onclick=()=>{state.api='http://10.0.2.2:8000';$('#api').value=state.api;saveSettings()};
 
 $('#testConnBtn').onclick=async()=>{
   const st = $('#connStatus');
   st.innerHTML = 'Testing...';
   st.style.color = 'var(--acc)';
   const t0 = performance.now();
   try {
     const res = await fetch(`${state.api.replace(/\/+$/, '')}/health`, { signal: AbortSignal.timeout(3000) });
     const ms = Math.round(performance.now() - t0);
     if(res.ok){
       st.innerHTML = `🟢 Connected (${ms}ms)`;
       st.style.color = 'var(--safe)';
     } else {
       st.innerHTML = `⚠️ HTTP ${res.status} (${ms}ms)`;
       st.style.color = 'var(--warn)';
     }
   } catch(e){
     st.innerHTML = `🔴 Offline (On-device fallback)`;
     st.style.color = 'var(--bad)';
   }
 };
 }
}

let timers=[];
function openDetail(id){
 const it=state.items.find(x=>x.id===id);
 if(!it)return;
 timers.forEach(clearTimeout);timers=[];
 const sealed=it.v==='bad'&&state.on;
 const bd=$('#sheetBody');
 bd.innerHTML=`<div class="msg ${sealed?'sealed':''}"><div class="row"><span class="ch">${CH[it.ch]||'📱'}</span><b>${esc(it.from)}</b></div><p style="margin-top:8px">${esc(it.body)}</p>${sealed?'<div class="seal">🔒 Sealed so you do not have to read it.</div>':''}</div>
 <div class="pipe">${[['🚦','Triage'],['🔗','URL'],['👤','Sender'],['📎','Files'],['⚖️','Verdict']].map((n,i)=>`<div class="nd" id="n${i}"><i>${n[0]}</i>${n[1]}</div>`).join('')}</div><div class="log" id="log"></div><div id="vd"></div>`;
 $('#sheet').classList.add('open');
 
 const t=time();
 const reflexTxt = it.evidence?.reflex || ('Reflex gate returned in 9ms with score ' + (it.r ? it.r.toFixed(2) : '0.70'));
 const urlTxt = it.evidence?.url || (it.u || 'No links found');
 const senderTxt = it.evidence?.sender || it.s;
 const attTxt = it.evidence?.attachment || (it.a || 'No attachments');

 const L=[
  [reflexTxt, 0],
  ['URL Investigator: ' + urlTxt, 1],
  ['Sender Investigator: ' + senderTxt, 2],
  ['Attachment Investigator: ' + attTxt, 3],
  ['Synthesizing verdict using ' + (state.mode==='llm'?'Gemini (fallback: Ollama)':'rules') + '...', 4],
  ['Finalized: ' + ({safe:'safe',warn:'suspicious',bad:'scam'}[it.v]) + ' (' + it.sc + '/100). Recommended: ' + it.act, 4]
 ];
 
 const log=$('#log');
 L.forEach((l,i)=>{
  timers.push(setTimeout(()=>{
   document.querySelectorAll('.nd').forEach((n,k)=>{n.classList.toggle('done',k<l[1]);n.classList.toggle('run',k===l[1])});
   log.innerHTML += `<div><span class="l">[${t}]</span> ${esc(l[0])}</div>`;
   if(i===L.length-1){
    document.querySelectorAll('.nd').forEach(n=>{n.classList.remove('run');n.classList.add('done')});
    $('#vd').innerHTML=`<div class="verdict ${it.v}"><h2>${{safe:'Looks safe',warn:'Be careful',bad:'This is a scam'}[it.v]}</h2><p>${esc(it.why)}</p><div class="acts">${it.v==='safe'?'<button class="btn" data-a="ok">Open message</button>':'<button class="btn" data-a="del">Delete and block sender</button><button class="btn ghost" data-a="rep">Report</button><button class="btn ghost" data-a="ok">Mark as safe</button>'}</div></div>`;
    document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
     $('#vd').innerHTML='<div class="verdict safe"><h2>Done</h2><p>'+({del:'Sender blocked and message deleted.',rep:'Reported. Thank you.',ok:'Marked as safe.'}[b.dataset.a])+'</p></div>';
    });
   }
  }, i*600 + 150));
 });
}

$('#back').onclick=()=>{timers.forEach(clearTimeout);$('#sheet').classList.remove('open')};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});

[1,0,2,5].forEach(i=>addItem(i));state.items.reverse();render();
</script>
</body>
</html>
