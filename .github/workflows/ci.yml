name: CI

on:
  push:
    branches: [ main, release-polish ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Safety Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suites
        run: |
          pytest -v

      - name: Run Safety & Invariants Harness
        run: |
          python -m harness.run

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Frontend Safeguard Tests
        run: |
          node tests/test_frontend_safeguards.js
